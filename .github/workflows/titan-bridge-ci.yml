name: TITAN bridge fail-closed tests
on:
  push:
    branches:
      - titan-render-scaleway-mistral
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r titan/requirements.txt
      - name: Test fail-closed bridge and model diagnostics
        run: cd titan && python -m unittest discover -p 'test*.py' -v
      - name: Independent cloud health probes of deployed Render gateways
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          targets={
            "titan_bridge":"https://titan-permanent-render-mistral-scaleway.onrender.com/health",
            "signed_runner":"https://titan-signed-agent-runtime-staging.onrender.com/health",
          }
          failed=[]
          for label,url in targets.items():
              try:
                  with urllib.request.urlopen(url,timeout=60) as r:
                      obj=json.load(r)
                  print(json.dumps({"target":label,"reachable":True,
                      "service":obj.get("service"),
                      "research_consensus_valid":obj.get("consensus_verified",False),
                      "trade_authorized":obj.get("trade_authorized",False),
                      "owner_auth_configured":obj.get("owner_auth_configured",obj.get("bridge_auth_configured")),
                      "provider_configured":obj.get("providers_configured",obj.get("provider_configuration"))},sort_keys=True))
                  if obj.get("trade_authorized") is True or obj.get("consensus_verified") is True: failed.append(label+":UNVERIFIED_APPROVAL")
              except Exception as e:
                  print(json.dumps({"target":label,"reachable":False,"error_type":type(e).__name__}))
                  failed.append(label+":HEALTH_UNAVAILABLE")
          if failed:raise SystemExit("TITAN_GATEWAY_SMOKE_CHECK_FAILED:"+",".join(failed))
          PY
